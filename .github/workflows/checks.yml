name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install milestone dependencies
        run: uv sync --locked --python 3.11
      - name: Test tools, evidence, protocols, and credential handling without API keys
        run: uv run python -m unittest discover -s tests -v
